syntax = "proto3";

package product;

option go_package = "hw_2/pkg/api;product";

service Product {
    rpc GetProduct (GetProductRequest) returns (GetProductResponse) {}
}

message GetProductRequest {
    int64 sku = 1; // @gotags: validate:"required, gt=0"
}

message GetProductResponse {
    int64 sku = 1;
    string name = 2;
    int32 price = 3;
}
